version: 2
updates:
  # Keep the GitHub Actions used in workflows up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      # Bundle all action bumps into a single PR to reduce noise.
      github-actions:
        patterns:
          - "*"

  # Keep Python dependencies (declared in header-analyzer/pyproject.toml) current.
  - package-ecosystem: pip
    directory: "/header-analyzer"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - python
