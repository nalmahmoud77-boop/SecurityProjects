[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "header-analyzer"
version = "1.0.0"
description = "Audit a website's HTTP security headers, grade the configuration A-F, and get remediation advice."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["security", "pentest", "http-headers", "csp", "hsts", "web-security", "appsec"]
authors = [{ name = "UltraMedica" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/nalmahmoud77-boop/SecurityProjects/tree/main/header-analyzer"
Issues = "https://github.com/nalmahmoud77-boop/SecurityProjects/issues"

[project.scripts]
header-analyzer = "header_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["header_analyzer*"]
